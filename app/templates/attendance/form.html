{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ 'Edit' if record else 'Add' }} Weekly Attendance — {{ student.name }}</h1>
  <form method="post">
    <label for="start_date">Start Date</label>
    <input type="date" id="start_date" name="start_date" value="{{ record.start_date if record else '' }}" required>

    <label for="end_date">End Date</label>
    <input type="date" id="end_date" name="end_date" value="{{ record.end_date if record else '' }}" required>

    <label for="total_days">Total Days</label>
    <input type="number" id="total_days" name="total_days" min="1" value="{{ record.total_days if record else '' }}" required>

    <label for="present_days">Present Days</label>
    <input type="number" id="present_days" name="present_days" min="0" value="{{ record.present_days if record else '' }}" required>

    <div class="actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('attendance.list_attendance', student_id=student.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
