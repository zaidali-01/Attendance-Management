{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ 'Edit Student' if student else 'Add Student' }}</h1>
  <form method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ student.name if student else '' }}" required>

    <label for="class_name">Class</label>
    <select id="class_name" name="class_name" required>
      <option value="">Select class</option>
      {% for c in class_choices %}
      <option value="{{ c }}" {% if student and student.class_name == c %}selected{% endif %}>Class {{ c }}</option>
      {% endfor %}
    </select>

    <label for="roll_no">Roll No. (optional)</label>
    <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no if student else '' }}">

    <div class="actions">
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
