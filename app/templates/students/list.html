{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Students</h1>
  <div class="filter-bar">
    <form method="get" style="display:flex; gap:10px; align-items:flex-end;">
      <div>
        <label for="class_name">Filter by class</label>
        <select id="class_name" name="class_name" onchange="this.form.submit()">
          <option value="">All classes</option>
          {% for c in class_choices %}
          <option value="{{ c }}" {% if class_filter == c %}selected{% endif %}>Class {{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  <a class="btn" href="{{ url_for('students.new_student') }}">+ Add Student</a>

  <table style="margin-top:16px;">
    <thead>
      <tr><th>Name</th><th>Class</th><th>Roll No.</th><th></th></tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.name }}</td>
        <td><span class="tag">Class {{ s.class_name }}</span></td>
        <td>{{ s.roll_no or '-' }}</td>
        <td>
          <a href="{{ url_for('attendance.list_attendance', student_id=s.id) }}">Attendance</a>
          &nbsp;|&nbsp;
          <a href="{{ url_for('students.edit_student', student_id=s.id) }}">Edit</a>
          &nbsp;|&nbsp;
          <form method="post" action="{{ url_for('students.delete_student', student_id=s.id) }}" style="display:inline" onsubmit="return confirm('Delete this student and all their attendance records?');">
            <button type="submit" style="background:none;border:none;color:#b3413a;cursor:pointer;padding:0;font:inherit;">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">No students yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
