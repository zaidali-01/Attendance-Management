<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Al-Ismat Academy Attendance{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand">🎓 Al-Ismat Academy — Attendance</div>
    {% if current_user.is_authenticated %}
    <nav>
      <a href="{{ url_for('students.list_students') }}">Students</a>
      <a href="{{ url_for('reports.build_report') }}">Reports</a>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
