{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Generate Attendance Report</h1>
  <form method="post">
    <label for="student_id">Student</label>
    <select id="student_id" name="student_id" required>
      <option value="">Select student</option>
      {% for s in students %}
      <option value="{{ s.id }}">{{ s.name }} — Class {{ s.class_name }}</option>
      {% endfor %}
    </select>

    <label for="from_date">From Date (optional)</label>
    <input type="date" id="from_date" name="from_date">

    <label for="to_date">To Date (optional)</label>
    <input type="date" id="to_date" name="to_date">

    <div class="actions">
      <button class="btn" type="submit">Generate PDF Report</button>
    </div>
  </form>
</div>
{% endblock %}
